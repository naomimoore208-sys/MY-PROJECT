<!DOCTYPE html>
<html>
    <head>
        <title>Number Guessing Game</title>
        <link rel="stylesheet" href="Game.css">
    </head>
    <body>
      
        <div class="head">
           <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
           <i class="fas fa-gamepad"></i>
           
                <div>
                   <h1>Number Guessing Game</h1>
                  <p>use your HTML and CSS skills to build this simple game.</p>
               </div>
        </div>
        
       
        
       
       
       
       <div class="card">
       
        
         <h1>Guess the Number</h1>
         <p>I have a number between 1 and 10.<br>Can you guess it?</p>
        <input type="number" placeholder="Enter a number 1-10" required>
        <button>Check</button>
        <p class="message">Make your guess! </p>
        <p class="att">Attempts: <span id="attempts">0</span></p>
      
    </div>
       
    </body>
</html>
